# base.yaml

# basic config
task_name: long_term_forecast
is_training: 1
model_id: test
model: Autoformer

# data loader
data: ETTh1
root_path: ./data/ETT/
data_path: ETTh1.csv
features: M
target: OT
freq: h
checkpoints: ./checkpoints/

# forecasting task
seq_len: 96
label_len: 48
pred_len: 96
seasonal_patterns: Monthly
inverse: false

# imputation task
mask_rate: 0.25

# anomaly detection task
anomaly_ratio: 0.25

# model define
expand: 2
d_conv: 4
top_k: 5
num_kernels: 6
enc_in: 7
dec_in: 7
c_out: 7
d_model: 512
n_heads: 8
e_layers: 2
d_layers: 1
d_ff: 2048
moving_avg: 25
factor: 1
distil: true
dropout: 0.1
embed: timeF
activation: gelu
channel_independence: 1
decomp_method: moving_avg
use_norm: 1
down_sampling_layers: 0
down_sampling_window: 1
down_sampling_method: null
seg_len: 96

# optimization
num_workers: 10
itr: 1
train_epochs: 10
batch_size: 32
patience: 3
learning_rate: 0.0001
des: test
loss: MSE
lradj: type1
use_amp: false

# GPU
use_gpu: true
gpu: 0
gpu_type: cuda
use_multi_gpu: false
devices: "0,1,2,3"

# de-stationary projector params
p_hidden_dims: [128, 128]
p_hidden_layers: 2

# metrics (dtw)
use_dtw: false

# Augmentation
augmentation_ratio: 0
seed: 2
jitter: false
scaling: false
permutation: false
randompermutation: false
magwarp: false
timewarp: false
windowslice: false
windowwarp: false
rotation: false
spawner: false
dtwwarp: false
shapedtwwarp: false
wdba: false
discdtw: false
discsdtw: false
extra_tag: ""

# TimeXer
patch_len: 16
stride: 8
stride_factor: 0.5

train_len: 3
vali_len: 1
test_len: 1
result_name: ""

mask_flag: 0
attn_mask: ""
attn_mask_factor: 4

attention_name: "FullAttention"
